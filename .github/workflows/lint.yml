name: Lint

on:
  push:
    branches: [main]
  pull_request:

jobs:
  eslint:
    name: ESLint (repo-wide)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: ESLint (src/, extension/, scripts/, tests)
        run: npm run lint
