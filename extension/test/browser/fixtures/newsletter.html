<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"><title>Newsletter overlay fixture</title></head>
<body>
<main><h1>Magazine</h1></main>
<div role="dialog" id="newsletter-modal" style="position:fixed;top:25%;left:25%;width:50%;background:#fff;border:1px solid #555;padding:28px;z-index:9999;">
  <h2>Join our newsletter!</h2>
  <p>Subscribe and get updates straight to your inbox. Enter your email address to sign up for our mailing list.</p>
  <input type="email" placeholder="Email address" />
  <button id="subscribe-btn">Subscribe</button>
  <button id="close-newsletter">No thanks</button>
</div>
<script src="sentinel.js"></script>
</body>
</html>
